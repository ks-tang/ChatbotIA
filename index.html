<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Assistant IA Vocal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Assistant IA Vocal</h1>

    <!-- Configuration de la clé API -->
    <div class="config-box">
      <input type="password" id="apiKey" placeholder="Entrez votre clé API Groq (gratuite)">
      <button id="saveKey">Enregistrer</button>
    </div>

    <!-- Zone d'affichage de la conversation -->
    <div id="chatLog" class="chat-log"></div>

    <!-- Contrôles -->
    <div class="controls">
      <input type="text" id="userInput" placeholder="Posez une question ou donnez une instruction...">
      <button id="sendBtn">Envoyer</button>
      <button id="micBtn">🎤 Écouter</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
