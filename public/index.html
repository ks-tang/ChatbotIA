<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant IA Vocal</title>

  <!-- Polices style Nothing (Dot Matrix + Sans-Serif Clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Logo -->
  <link rel="icon" type="image/svg+xml" href="images/chatbotia_logo.svg">
</head>
<body>

  <!-- Conteneur d'injection du Header -->
  <div id="header-placeholder"></div>
  
  <main class="container">
    <h1>Assistant IA Vocal Général</h1>

    <!-- Menu de sélection d'IA pour l'utilisateur -->
    <div class="config-box">
      <label for="modelSelect">IA :</label>
      <select id="modelSelect">
        <!-- Option Groq : ultra-rapide -->
        <option value="llama-3.3-70b-versatile" data-provider="groq">Groq - Llama 3.3 70B (Ultra Rapide)</option>
        
        <!-- Options OpenRouter : modèles gratuits variés -->
        <option value="openai/gpt-oss-20b:free" data-provider="openrouter">GPT OSS 20B (Gratuit)</option>
        <option value="google/gemma-4-26b-a4b-it:free" data-provider="openrouter">Google Gemma 4 26B A4B (Gratuit)</option>
        <option value="nvidia/nemotron-3-ultra-550b-a55b:free" data-provider="openrouter">Nvidia Nemotron 3 Ultra 550B A55B (Gratuit)</option>

        <!-- Options uncloseai 
        <option value="adamo1139/Hermes-3-Llama-3.1-8B-FP8-Dynamic" data-provider="uncloseai" data-endpoint="https://hermes.ai.unturf.com/v1">Hermes</option>
        <option value="hf.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M" data-provider="uncloseai" data-endpoint="https://qwen.ai.unturf.com/v1">Qwen 3 Coder</option>
        -->
      </select>
    </div>

    <!-- Zone d'affichage des messages -->
    <div id="chatLog" class="chat-log"></div>

    <!-- Champ de saisie et boutons -->
    <div class="controls">
      <input type="text" id="userInput" placeholder="Posez une question...">
      <button id="sendBtn">Envoyer</button>
      <button id="micBtn">🎤 Écouter</button>
      <button id="stopBtn" title="Arrêter la lecture vocale">⏹️ Stop</button>
    </div>
  </main>

  <!-- Footer pour Ko-fi -->
  <footer class="footer-kofi">
    <div class="kofi-card">
      <span class="kofi-dot"></span>
      <p class="kofi-text">Vous aimez ce projet ?</p>
      <a href="https://ko-fi.com/kstang" target="_blank" rel="noopener noreferrer" class="kofi-btn">
        <span>M'offrir un chocolat sur Kofi</span>
        <span class="kofi-arrow">→</span>
      </a>
    </div>
  </footer>

  <!-- Script d'injection du Header -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });
  </script>
  <script src="index.js"></script>
</body>
</html>
